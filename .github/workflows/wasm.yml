name: WASM

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: |
          sudo apt-get install -y build-essential clang
          cargo install wasm-pack --version 0.13.1 --locked
          rustup target add wasm32-unknown-unknown
      - name: Build and test
        run: ./scripts/test-wasm.sh
