name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-darwin:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [ x86_64, aarch64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure
        if: matrix.arch == 'x86_64'
        run: |
          rustup target add x86_64-apple-darwin
          echo "TARGET=x86_64-apple-darwin" >> $GITHUB_ENV
          echo "DIST=bysqr-darwin-x86_64" >> $GITHUB_ENV
          echo "DIST_HEADLESS=bysqr-darwin-x86_64-headless" >> $GITHUB_ENV
      - name: Configure
        if: matrix.arch == 'aarch64'
        run: |
          rustup target add aarch64-apple-darwin
          echo "TARGET=aarch64-apple-darwin" >> $GITHUB_ENV
          echo "DIST=bysqr-darwin-aarch64" >> $GITHUB_ENV
          echo "DIST_HEADLESS=bysqr-darwin-aarch64-headless" >> $GITHUB_ENV
      - name: Build
        run: |
          mkdir -p target/dist
          cargo build --release --bin bysqr --target $TARGET
          cp target/$TARGET/release/bysqr target/dist/$DIST_HEADLESS
          cargo build --release --bin bysqr --target $TARGET --features preview
          cp target/$TARGET/release/bysqr target/dist/$DIST
      - name: Import Apple signing certificate
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_DEVELOPER_ID_P12:?Missing APPLE_DEVELOPER_ID_P12 secret}"
          : "${APPLE_DEVELOPER_ID_P12_PASSWORD:?Missing APPLE_DEVELOPER_ID_P12_PASSWORD secret}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/apple-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_DEVELOPER_ID_P12" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk -v team="$APPLE_TEAM_ID" \
                'index($0, "Developer ID Application:") && index($0, "(" team ")") { print $2; exit }'
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "No Developer ID Application identity found for team $APPLE_TEAM_ID" >&2
            security find-identity -v -p codesigning "$keychain_path"
            exit 1
          fi

          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
      - name: Sign macOS binaries
        shell: bash
        run: |
          set -euo pipefail

          sign_binary() {
            local binary="$1"
            local identifier="$2"

            codesign \
              --force \
              --keychain "$APPLE_KEYCHAIN_PATH" \
              --identifier "$identifier" \
              --options runtime \
              --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" \
              "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          }

          sign_binary "target/dist/$DIST" "sk.easydoklad.bysqr"
          sign_binary "target/dist/$DIST_HEADLESS" "sk.easydoklad.bysqr.headless"
      - name: Notarize macOS binaries
        shell: bash
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER_ID:?Missing APPLE_API_ISSUER_ID secret}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID secret}"
          : "${APPLE_API_KEY_P8:?Missing APPLE_API_KEY_P8 secret}"

          api_key_path="$RUNNER_TEMP/notary-api-key.p8"
          submission_path="$RUNNER_TEMP/bysqr-$TARGET-notarization.zip"
          result_path="$RUNNER_TEMP/notarization-result.json"
          log_path="$RUNNER_TEMP/notarization-log.json"

          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          chmod 0600 "$api_key_path"
          /usr/bin/ditto -c -k --keepParent target/dist "$submission_path"

          submit_exit=0
          xcrun notarytool submit "$submission_path" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --output-format json > "$result_path" || submit_exit=$?
          cat "$result_path"

          submission_id="$(
            /usr/bin/plutil -extract id raw -o - "$result_path" 2>/dev/null || true
          )"
          status="$(
            /usr/bin/plutil -extract status raw -o - "$result_path" 2>/dev/null || true
          )"
          if [[ -z "$submission_id" ]]; then
            echo "Notary service did not return a submission ID" >&2
            exit 1
          fi

          xcrun notarytool log "$submission_id" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            "$log_path"
          cat "$log_path"

          if (( submit_exit != 0 )) || [[ "$status" != "Accepted" ]]; then
            echo "Apple notarization failed with status: ${status:-unknown}" >&2
            exit 1
          fi
      - name: Remove temporary Apple credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/apple-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/notary-api-key.p8"
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: target/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ x86_64, aarch64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y build-essential musl-tools
          rustup target add x86_64-unknown-linux-musl
          echo "TARGET=x86_64-unknown-linux-musl" >> $GITHUB_ENV
          echo "DIST=bysqr-linux-x86_64" >> $GITHUB_ENV
          echo "DIST_HEADLESS=bysqr-linux-x86_64-headless" >> $GITHUB_ENV
      - name: Configure
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup target add aarch64-unknown-linux-gnu
          echo "TARGET=aarch64-unknown-linux-gnu" >> $GITHUB_ENV
          echo "DIST=bysqr-linux-aarch64" >> $GITHUB_ENV
          echo "DIST_HEADLESS=bysqr-linux-aarch64-headless" >> $GITHUB_ENV
      - name: Build
        run: |
          mkdir -p target/dist
          cargo build --release --bin bysqr --target $TARGET
          cp target/$TARGET/release/bysqr target/dist/$DIST_HEADLESS
          cargo build --release --bin bysqr --target $TARGET --features preview
          cp target/$TARGET/release/bysqr target/dist/$DIST
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: target/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure
        run: |
          sudo apt-get install -y build-essential clang
          cargo install wasm-pack --version 0.15.0 --locked
          rustup target add wasm32-unknown-unknown
      - name: Build and test
        run: ./scripts/test-wasm.sh
      - name: Package
        run: |
          mkdir -p target/dist
          CRATE_VERSION="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "bysqr") | .version')"
          DIST_NAME="bysqr-wasm-${CRATE_VERSION}-web"
          mkdir -p "target/wasm-artifact/${DIST_NAME}/schemas"
          cp pkg/bysqr.js pkg/bysqr.d.ts pkg/bysqr_bg.wasm pkg/bysqr_bg.wasm.d.ts pkg/package.json "target/wasm-artifact/${DIST_NAME}/"
          cp docs/wasm.md "target/wasm-artifact/${DIST_NAME}/README.md"
          cp LICENSE.md "target/wasm-artifact/${DIST_NAME}/LICENSE"
          cp spec/pay-by-square.schema.json "target/wasm-artifact/${DIST_NAME}/schemas/"
          cp spec/invoice-by-square.schema.json "target/wasm-artifact/${DIST_NAME}/schemas/"
          cp spec/invoice-items-by-square.schema.json "target/wasm-artifact/${DIST_NAME}/schemas/"
          cp spec/invoice-items-list.schema.json "target/wasm-artifact/${DIST_NAME}/schemas/"
          jq -n \
            --arg rustCrateVersion "${CRATE_VERSION}" \
            '{wasmApiVersion: 1, rustCrateVersion: $rustCrateVersion, target: "web", features: ["wasm"]}' \
            > "target/wasm-artifact/${DIST_NAME}/manifest.json"
          tar -C target/wasm-artifact -czf "target/dist/${DIST_NAME}.tar.gz" "${DIST_NAME}"
          cd target/dist
          sha256sum "${DIST_NAME}.tar.gz" > "${DIST_NAME}.tar.gz.sha256"
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: target/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [ x86_64, aarch64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure
        if: matrix.arch == 'x86_64'
        run: |
          rustup target add x86_64-pc-windows-msvc
          echo "TARGET=x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "DIST=bysqr-win-x86_64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "DIST_HEADLESS=bysqr-win-x86_64-headless.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure
        if: matrix.arch == 'aarch64'
        run: |
          rustup target add aarch64-pc-windows-msvc
          echo "TARGET=aarch64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "DIST=bysqr-win-aarch64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "DIST_HEADLESS=bysqr-win-aarch64-headless.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build
        run: |
          mkdir -Force target\dist
          cargo build --release --bin bysqr --target $env:TARGET
          Copy-Item "target\$env:TARGET\release\bysqr.exe" "target\dist\$env:DIST_HEADLESS"
          cargo build --release --bin bysqr --target $env:TARGET --features preview
          Copy-Item "target\$env:TARGET\release\bysqr.exe" "target\dist\$env:DIST"
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: target/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
