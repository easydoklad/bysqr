[package]
name = "bysqr"
version = "0.1.0"
edition = "2021"
description = "PAY, INVOICE and INVOICE ITEMS by square encoder and decoder"
license = "MIT"
repository = "https://github.com/easydoklad/bysqr"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bysqrcli"
path = "src/bin/bysqr.rs"

[[bin]]
name = "theme-preview"
path = "src/bin/theme_preview.rs"

[features]
default = []
preview = ["eframe"]
wasm = ["wasm-bindgen"]
qr-reader = ["dep:rqrr"]

[dependencies]
quick-xml = { version = "0.37.2", features = ["serialize"] }
serde = { version = "1.0.199", features = ["derive"] }
chrono = "0.4.38"
crc32fast = "1.4.0"
liblzma = { version = "0.3.5", features = ["static"] }
qrcode = "0.14.0"
image = { version = "0.25.1", features = ["png", "jpeg"] }
clap = { version = "4.5.26", features = ["derive"] }
base64 = "0.22.1"
eframe = { version = "0.30.0", optional = true }
usvg = "0.44.0"
xmltree = "0.11.0"
resvg = "0.44.0"
jpeg-encoder = "0.6.0"
wasm-bindgen = { version = "0.2.100", optional = true }
serde_json = "1.0.151"
rqrr = { version = "0.10.1", optional = true, default-features = false, features = ["img"] }

[dev-dependencies]
jsonschema = { version = "0.51.0", default-features = false }
